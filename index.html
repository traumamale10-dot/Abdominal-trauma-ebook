<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F6B5E">
<title>บาดเจ็บช่องท้อง — คู่มือผู้ป่วยและญาติ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
// ตั้งธีมก่อนหน้าเว็บแสดง (กันจอกะพริบ)
(function () {
  try {
    var t = localStorage.getItem('abdTheme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    var f = parseFloat(localStorage.getItem('abdFont'));
    if (f >= 0.9 && f <= 1.6) document.documentElement.style.setProperty('--fz', f);
  } catch (e) {}
})();
</script>
<style>
/* ═══════════════════════════════════════════════
   ธีมแนวอนาคต (Holo Glass) — สว่าง / มืด
   ═══════════════════════════════════════════════ */
:root {
  --fz: 1.1;
  --bg:#E9F1F7; --bg-glow1:rgba(43,182,190,.18); --bg-glow2:rgba(84,128,255,.14); --grid:rgba(11,60,96,.05);
  --surface:rgba(255,255,255,.82); --surface-solid:#FFFFFF; --surface2:#E2ECF3; --line:rgba(12,64,100,.13);
  --ink:#0A2234; --ink2:#46607A;
  --brand:#0A8790; --brand-ink:#FFFFFF; --brand-soft:rgba(10,135,144,.12); --glow:rgba(10,135,144,.28);
  --amber:#8A5D00; --amber-bg:#FFF3D6;
  --danger:#C42B2B; --danger-bg:#FDE9E8; --danger-ink:#FFFFFF; --danger-glow:rgba(228,58,58,.35);
  --ok:#1E7A4C; --ok-bg:#E3F5EB;
  --shadow:0 1px 1px rgba(10,34,52,.04), 0 10px 28px rgba(10,34,52,.08);
  --dock:rgba(255,255,255,.78);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#06111C; --bg-glow1:rgba(43,210,200,.16); --bg-glow2:rgba(80,120,255,.14); --grid:rgba(120,200,255,.045);
    --surface:rgba(16,36,56,.72); --surface-solid:#0F2236; --surface2:#15304A; --line:rgba(120,200,255,.16);
    --ink:#E6F2FA; --ink2:#9DB7CC;
    --brand:#3FD6CC; --brand-ink:#03141E; --brand-soft:rgba(63,214,204,.14); --glow:rgba(63,214,204,.38);
    --amber:#F4C760; --amber-bg:rgba(244,199,96,.12);
    --danger:#FF6E6E; --danger-bg:rgba(255,110,110,.13); --danger-ink:#1C0606; --danger-glow:rgba(255,90,90,.45);
    --ok:#6EE0A6; --ok-bg:rgba(110,224,166,.12);
    --shadow:0 1px 1px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
    --dock:rgba(10,26,42,.78);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#06111C; --bg-glow1:rgba(43,210,200,.16); --bg-glow2:rgba(80,120,255,.14); --grid:rgba(120,200,255,.045);
  --surface:rgba(16,36,56,.72); --surface-solid:#0F2236; --surface2:#15304A; --line:rgba(120,200,255,.16);
  --ink:#E6F2FA; --ink2:#9DB7CC;
  --brand:#3FD6CC; --brand-ink:#03141E; --brand-soft:rgba(63,214,204,.14); --glow:rgba(63,214,204,.38);
  --amber:#F4C760; --amber-bg:rgba(244,199,96,.12);
  --danger:#FF6E6E; --danger-bg:rgba(255,110,110,.13); --danger-ink:#1C0606; --danger-glow:rgba(255,90,90,.45);
  --ok:#6EE0A6; --ok-bg:rgba(110,224,166,.12);
  --shadow:0 1px 1px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
  --dock:rgba(10,26,42,.78);
  color-scheme: dark;
}

* { box-sizing:border-box; margin:0; padding:0; }
html { font-size:calc(16px * var(--fz)); -webkit-text-size-adjust:100%; }
body {
  font-family:'IBM Plex Sans Thai Looped','IBM Plex Sans Thai',sans-serif;
  color:var(--ink); line-height:1.75; min-height:100vh; min-height:100dvh;
  background-color:var(--bg);
  background-image:
    radial-gradient(60rem 40rem at 110% -10%, var(--bg-glow2), transparent 60%),
    radial-gradient(50rem 36rem at -20% 20%, var(--bg-glow1), transparent 60%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:auto, auto, 28px 28px, 28px 28px;
  background-attachment:fixed;
}
h1, h2, h3, .ui, button { font-family:'IBM Plex Sans Thai','IBM Plex Sans Thai Looped',sans-serif; }
button { font:inherit; color:inherit; }
a { color:var(--brand); }
:focus-visible { outline:3px solid var(--brand); outline-offset:2px; border-radius:8px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }

/* ═══════════════ แถบบน ═══════════════ */
.topbar { position:sticky; top:0; z-index:50; padding-top:env(safe-area-inset-top);
  background:var(--dock); backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4); border-bottom:1px solid var(--line); }
.topbar-in { max-width:760px; margin:0 auto; display:flex; align-items:center; gap:10px; padding:8px 12px; }
.icon-btn { width:44px; height:44px; flex-shrink:0; border-radius:14px; border:1px solid var(--line); background:var(--surface);
  display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.05rem; color:var(--ink); }
.icon-btn:active { transform:scale(.96); }
.top-title { flex:1; min-width:0; line-height:1.25; }
.top-title small { display:block; font-size:.72rem; color:var(--brand); font-weight:600; letter-spacing:.01em; }
.top-title span { display:block; font-weight:600; font-size:.98rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ring { width:44px; height:44px; flex-shrink:0; position:relative; }
.ring svg { width:100%; height:100%; transform:rotate(-90deg); }
.ring circle { fill:none; stroke-width:4; }
.ring .bgc { stroke:var(--surface2); }
.ring .fgc { stroke:var(--brand); stroke-linecap:round; transition:stroke-dashoffset .5s ease; filter:drop-shadow(0 0 4px var(--glow)); }
.ring b { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.68rem; font-weight:700; }
.progress { display:none; }

/* ═══════════════ เนื้อหา ═══════════════ */
main { max-width:760px; margin:0 auto; padding:18px 16px 170px; }
main.enter-next { animation:inNext .32s ease both; }
main.enter-prev { animation:inPrev .32s ease both; }
@keyframes inNext { from { opacity:0; transform:translateX(18px); } to { opacity:1; transform:none; } }
@keyframes inPrev { from { opacity:0; transform:translateX(-18px); } to { opacity:1; transform:none; } }

.chapter-head { margin:4px 0 14px; }
.chapter-no { display:inline-flex; align-items:center; gap:6px; font-size:.8rem; font-weight:700; color:var(--brand); background:var(--brand-soft); border:1px solid var(--glow); padding:3px 12px; border-radius:20px; }
.chapter-no.danger { color:var(--danger); background:var(--danger-bg); border-color:var(--danger-glow); }
.chapter-head h1 { font-size:1.7rem; line-height:1.28; margin-top:10px; letter-spacing:-.01em; }
.jump { display:flex; flex-direction:column; gap:6px; margin:4px 0 18px; padding:12px; border-radius:18px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); }
.jump::before { content:'ในบทนี้'; font-size:.8rem; font-weight:700; color:var(--ink2); padding:0 4px 2px; font-family:'IBM Plex Sans Thai',sans-serif; }
.jump a { display:flex; align-items:flex-start; gap:10px; min-height:44px; padding:10px 12px; border-radius:12px; background:var(--brand-soft); color:var(--ink); text-decoration:none; font-size:.92rem; font-weight:600; line-height:1.45; font-family:'IBM Plex Sans Thai',sans-serif; }
.jump a::before { content:'↓'; flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--brand); color:var(--brand-ink); display:flex; align-items:center; justify-content:center; font-size:.8rem; margin-top:1px; }
.jump a:active { transform:scale(.99); }
h2 { font-size:1.22rem; line-height:1.35; margin:26px 0 10px; scroll-margin-top:80px; }
h3 { font-size:1.05rem; margin:16px 0 6px; }
p + p { margin-top:10px; }
.lead { font-size:1.06rem; }

ul.dots { list-style:none; display:flex; flex-direction:column; gap:8px; }
ul.dots li { position:relative; padding-left:24px; }
ul.dots li::before { content:''; position:absolute; left:5px; top:.68em; width:9px; height:9px; border-radius:3px; background:var(--brand); box-shadow:0 0 8px var(--glow); transform:rotate(45deg); }
ul.warn li::before { background:var(--danger); box-shadow:0 0 8px var(--danger-glow); }

.note { border:1px solid rgba(200,150,30,.3); background:var(--amber-bg); padding:12px 16px; border-radius:16px; margin:16px 0; }
.note b { color:var(--amber); }
.section-block { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; margin:14px 0; box-shadow:var(--shadow); }
.section-block h2, .section-block h3 { margin-top:0; }

.compare { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0; }
.compare > div { border-radius:20px; padding:16px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); position:relative; overflow:hidden; }
.compare > div::before { content:''; position:absolute; left:0; right:0; top:0; height:4px; }
.compare .nonop::before { background:linear-gradient(90deg,var(--brand),transparent); }
.compare .op::before { background:linear-gradient(90deg,var(--danger),transparent); }
.compare h3 { margin:0 0 6px; display:flex; align-items:center; gap:8px; }
.compare dl dt { font-size:.78rem; font-weight:700; color:var(--ink2); margin-top:10px; font-family:'IBM Plex Sans Thai',sans-serif; }
.compare dl dd { margin:2px 0 0; }
@media (max-width:600px) { .compare { grid-template-columns:1fr; } }

.twocol { display:grid; grid-template-columns:1fr 1.25fr; gap:12px; margin:14px 0; }
.twocol > div { border-radius:20px; padding:14px 16px; border:1px solid var(--line); }
.twocol .good { background:var(--ok-bg); }
.twocol .bad { background:var(--danger-bg); }
.twocol h3 { margin:0 0 8px; }
.twocol .good h3 { color:var(--ok); }
.twocol .bad h3 { color:var(--danger); }
.twocol .good ul.dots li::before { background:var(--ok); box-shadow:none; }
@media (max-width:600px) { .twocol { grid-template-columns:1fr; } }

.alarm { background:linear-gradient(150deg,#D83A3A,#A81E2E); color:#fff; border-radius:22px; padding:18px; margin:14px 0; box-shadow:0 12px 36px var(--danger-glow); }
.alarm h2 { margin:0 0 10px; color:inherit; }
.alarm ul { list-style:none; display:flex; flex-direction:column; gap:6px; }
.alarm li { display:flex; gap:10px; align-items:flex-start; font-weight:600; padding:8px 10px; border-radius:12px; background:rgba(255,255,255,.1); }
.alarm li i { font-style:normal; flex-shrink:0; width:1.6em; text-align:center; }
.call-btn { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:14px; padding:14px; border-radius:16px; background:#fff; color:#B42318; font-size:1.5rem; font-weight:700; text-decoration:none; font-family:'IBM Plex Sans Thai',sans-serif; }
.call-btn small { font-size:.85rem; font-weight:600; color:#6B3B3B; }

details.faq { background:var(--surface); border:1px solid var(--line); border-radius:18px; margin:10px 0; overflow:hidden; box-shadow:var(--shadow); }
details.faq summary { list-style:none; cursor:pointer; padding:14px 50px 14px 16px; font-weight:600; position:relative; font-family:'IBM Plex Sans Thai',sans-serif; }
details.faq summary::-webkit-details-marker { display:none; }
details.faq summary::after { content:'+'; position:absolute; right:12px; top:50%; transform:translateY(-50%); width:30px; height:30px; border-radius:50%; background:var(--brand-soft); color:var(--brand); display:flex; align-items:center; justify-content:center; font-size:1.2rem; }
details.faq[open] summary::after { content:'−'; }
details.faq div { padding:0 16px 14px; color:var(--ink2); }

/* การดูแลตามอวัยวะ */
.oc-list { display:flex; flex-direction:column; gap:10px; margin:14px 0; }
details.oc { background:var(--surface); border:1px solid var(--line); border-radius:20px; overflow:hidden; box-shadow:var(--shadow); }
details.oc[open] { border-color:var(--oc); box-shadow:0 0 0 1px var(--oc), var(--shadow); }
details.oc summary { list-style:none; display:flex; align-items:center; gap:12px; padding:14px 48px 14px 14px; cursor:pointer; position:relative; }
details.oc summary::-webkit-details-marker { display:none; }
details.oc summary::after { content:'+'; position:absolute; right:12px; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%; background:var(--brand-soft); color:var(--brand); display:flex; align-items:center; justify-content:center; font-size:1.25rem; font-family:'IBM Plex Sans Thai',sans-serif; }
details.oc[open] summary::after { content:'−'; }
.oc-sw { width:14px; height:42px; border-radius:7px; background:var(--oc); flex-shrink:0; box-shadow:0 0 10px var(--oc); }
.oc-t { line-height:1.35; }
.oc-t b { display:block; font-size:1.08rem; font-family:'IBM Plex Sans Thai',sans-serif; }
.oc-t small { color:var(--ink2); font-size:.85rem; }
.oc-body { padding:0 16px 16px; }
.oc-body h3 { margin:6px 0 8px; font-size:.98rem; }
.oc-warn { margin-top:12px; background:var(--danger-bg); border:1px solid var(--danger-glow); border-radius:16px; padding:10px 14px 12px; }
.oc-warn h3 { color:var(--danger); margin-top:0; }
button.ax-more { background:var(--brand); color:var(--brand-ink); border:none; border-radius:14px; padding:10px 16px; cursor:pointer; font-size:.95rem; box-shadow:0 6px 18px var(--glow); }

/* ═══════════════ หน้าแรก ═══════════════ */
.hero { margin:2px 0 18px; }
.hero-text { text-align:left; }
.hero-kicker { display:inline-flex; align-items:center; gap:8px; font-size:.82rem; font-weight:700; color:var(--brand); font-family:'IBM Plex Sans Thai',sans-serif; }
.hero-kicker::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--brand); box-shadow:0 0 10px var(--glow); }
.hero h1 { font-size:2.05rem; line-height:1.18; letter-spacing:-.02em; margin-top:6px; }
.hero p { color:var(--ink2); margin-top:10px; }
.hero-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:54px; padding:10px 16px; border-radius:16px; border:none; cursor:pointer; font-weight:700; font-size:1rem; text-decoration:none; font-family:'IBM Plex Sans Thai',sans-serif; }
.btn-brand { background:var(--brand); color:var(--brand-ink); box-shadow:0 8px 24px var(--glow); }
.btn-danger { background:var(--danger-bg); color:var(--danger); border:1.5px solid var(--danger-glow); }
.btn-ghost { background:var(--surface); color:var(--ink); border:1px solid var(--line); }
.hero-ax { margin-top:18px; }
@media (min-width:760px) { .hero { display:grid; grid-template-columns:1fr 380px; gap:24px; align-items:start; } .hero-text { padding-top:40px; } .hero-ax { margin-top:0; } }

/* เส้นทางการดูแล (สารบัญแบบลำดับขั้น) */
.journey-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:26px 0 8px; }
.journey-head h2 { margin:0; }
.journey-head span { font-size:.85rem; color:var(--ink2); font-weight:600; font-family:'IBM Plex Sans Thai',sans-serif; }
.toc { list-style:none; display:flex; flex-direction:column; gap:0; position:relative; }
.toc li { position:relative; }
.journey .toc::before { content:''; position:absolute; left:26px; top:22px; bottom:22px; width:2px; background:linear-gradient(var(--brand), var(--line)); opacity:.6; }
.toc a { position:relative; display:flex; align-items:center; gap:14px; padding:10px 10px; margin:4px 0; border-radius:18px; text-decoration:none; color:var(--ink); }
.toc a:active { background:var(--surface); }
.toc .n { position:relative; z-index:1; flex-shrink:0; width:36px; height:36px; margin-left:0; border-radius:12px; background:var(--surface-solid); border:1.5px solid var(--brand); color:var(--brand); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'IBM Plex Sans Thai',sans-serif; font-size:.95rem; }
.toc a.done .n { background:var(--brand); color:var(--brand-ink); box-shadow:0 0 12px var(--glow); }
.toc a.danger .n { border-color:var(--danger); color:var(--danger); }
.toc a.danger.done .n { background:var(--danger); color:#fff; box-shadow:0 0 12px var(--danger-glow); }
.toc .t { flex:1; min-width:0; line-height:1.4; padding:8px 12px; border-radius:16px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); }
.toc .t b { display:block; font-weight:600; font-family:'IBM Plex Sans Thai',sans-serif; }
.toc .t small { color:var(--ink2); font-size:.82rem; }
.toc a.cur .t { border-color:var(--brand); box-shadow:0 0 0 1px var(--brand), 0 0 18px var(--glow); }
.toc .go { display:none; }
.disclaimer { font-size:.85rem; color:var(--ink2); text-align:center; margin-top:22px; }

.next-card { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:30px; padding:16px 18px; border-radius:20px; background:linear-gradient(135deg,var(--brand),color-mix(in srgb, var(--brand) 70%, #4b6bff)); color:var(--brand-ink); text-decoration:none; font-family:'IBM Plex Sans Thai',sans-serif; box-shadow:0 10px 28px var(--glow); }
.next-card small { display:block; opacity:.85; font-size:.8rem; }
.next-card b { font-size:1.06rem; }
.next-card span.arr { font-size:1.7rem; }

/* ใบบันทึก */
.form { display:flex; flex-direction:column; gap:12px; }
.form label { display:flex; flex-direction:column; gap:4px; font-weight:600; font-size:.92rem; font-family:'IBM Plex Sans Thai',sans-serif; }
.form input[type=text], .form input[type=date], .form input[type=tel], .form textarea {
  font:inherit; font-weight:400; padding:11px 12px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface-solid); color:var(--ink); min-height:50px; }
.form input:focus, .form textarea:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
.form textarea { min-height:80px; resize:vertical; }
.form .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:500px) { .form .row2 { grid-template-columns:1fr; } }
.radio-row { display:flex; gap:8px; flex-wrap:wrap; }
.radio-row label { flex-direction:row; align-items:center; gap:8px; padding:10px 14px; border:1.5px solid var(--line); border-radius:14px; background:var(--surface-solid); cursor:pointer; font-weight:500; }
.radio-row input { width:20px; height:20px; accent-color:var(--brand); }
.saved-msg { font-size:.85rem; color:var(--ok); min-height:1.4em; }
.refs { font-size:.85rem; color:var(--ink2); padding-left:1.2em; display:flex; flex-direction:column; gap:6px; }

/* ═══════════════ แถบล่าง (ลอย) ═══════════════ */
.bottombar { position:fixed; left:0; right:0; bottom:0; z-index:50; padding:0 10px calc(10px + env(safe-area-inset-bottom)); pointer-events:none; }
.bottombar > * { pointer-events:auto; }
.bottombar-in, .au-panel { max-width:560px; margin:0 auto; background:var(--dock); backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid var(--line); box-shadow:0 10px 34px rgba(0,0,0,.18); }
.bottombar-in { display:flex; align-items:center; gap:8px; padding:7px; border-radius:24px; }
.nav-btn { min-height:50px; min-width:50px; padding:0 14px; border-radius:18px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px; color:var(--ink); }
.nav-btn:disabled { opacity:.3; cursor:default; }
.nav-btn.primary { background:var(--brand); color:var(--brand-ink); border-color:transparent; box-shadow:0 6px 18px var(--glow); }
.nav-mid { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:.78rem; color:var(--ink2); font-weight:700; font-family:'IBM Plex Sans Thai',sans-serif; }
.dots-bar { display:flex; gap:4px; }
.dots-bar i { width:6px; height:6px; border-radius:3px; background:var(--surface2); transition:all .25s; }
.dots-bar i.on { width:18px; background:var(--brand); box-shadow:0 0 8px var(--glow); }
.dots-bar i.done { background:var(--brand); opacity:.45; }
.nav-btn.au-btn { display:none; }
.nav-btn.au-btn.has-audio { display:flex; }
.nav-btn.au-btn.active { background:var(--brand-soft); border-color:var(--brand); color:var(--brand); }
@media (max-width:420px) { .nav-btn .lbl { display:none; } .dots-bar i { width:5px; } .dots-bar i.on { width:14px; } }

.au-panel { display:none; align-items:center; gap:8px; padding:8px 10px; border-radius:20px; margin-bottom:8px; }
.au-panel.show { display:flex; }
.au-play { width:44px; height:44px; flex-shrink:0; border-radius:50%; border:none; background:var(--brand); color:var(--brand-ink); font-size:1.05rem; cursor:pointer; box-shadow:0 0 14px var(--glow); }
.au-seek { flex:1; min-width:40px; accent-color:var(--brand); height:28px; }
.au-time { font-size:.78rem; color:var(--ink2); white-space:nowrap; font-variant-numeric:tabular-nums; }
.au-sm { min-width:40px; height:36px; padding:0 8px; border-radius:18px; border:1px solid var(--line); background:var(--surface); font-size:.85rem; font-weight:700; cursor:pointer; }
.au-sm.on { background:var(--brand-soft); border-color:var(--brand); color:var(--brand); }
body.au-open main { padding-bottom:240px; }
@media (max-width:380px) { .au-time { display:none; } }

.nav-btn.sos-btn { background:var(--danger-bg); border-color:var(--danger-glow); color:var(--danger); font-size:1.15rem; padding:0 12px; }
body.on-danger .nav-btn.sos-btn { display:none; }

/* ═══════════════ แผงด้านข้าง / หน้าต่าง ═══════════════ */
.scrim { position:fixed; inset:0; background:rgba(2,10,18,.55); backdrop-filter:blur(3px); z-index:80; display:none; }
.scrim.show { display:block; }
.drawer { position:fixed; top:0; bottom:0; left:0; width:min(380px,90vw); background:var(--bg); z-index:90; transform:translateX(-102%); transition:transform .28s ease; overflow-y:auto; padding:calc(14px + env(safe-area-inset-top)) 12px 30px; box-shadow:var(--shadow); border-right:1px solid var(--line); }
.drawer.show { transform:none; }
.drawer-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; padding:0 4px; }
.drawer-head b { font-size:1.15rem; font-family:'IBM Plex Sans Thai',sans-serif; }

.sheet { position:fixed; left:50%; bottom:0; transform:translate(-50%,105%); width:min(520px,100%); background:var(--surface-solid); z-index:90; border-radius:26px 26px 0 0; padding:10px 18px calc(22px + env(safe-area-inset-bottom)); transition:transform .28s ease; box-shadow:0 -10px 34px rgba(0,0,0,.25); border:1px solid var(--line); }
.sheet::before { content:''; display:block; width:44px; height:5px; border-radius:3px; background:var(--surface2); margin:0 auto 12px; }
.sheet.show { transform:translate(-50%,0); }
.sheet h3 { margin:0 0 10px; }
.seg { display:flex; gap:6px; background:var(--surface2); padding:4px; border-radius:16px; }
.seg button { flex:1; min-height:48px; border:none; border-radius:12px; background:transparent; cursor:pointer; font-weight:700; color:var(--ink2); }
.seg button.on { background:var(--surface-solid); color:var(--ink); box-shadow:var(--shadow); }
.font-row { display:flex; align-items:center; gap:10px; }
.font-row button { width:58px; height:52px; border-radius:14px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-weight:700; }
.font-row .sample { flex:1; text-align:center; color:var(--ink2); }

.modal { position:fixed; inset:0; z-index:100; background:rgba(2,10,18,.6); backdrop-filter:blur(4px); display:none; align-items:flex-end; justify-content:center; }
.modal.show { display:flex; }
.modal-box { width:min(520px,100%); max-height:100dvh; overflow-y:auto; background:var(--surface-solid); border-radius:26px 26px 0 0; padding:16px 18px calc(22px + env(safe-area-inset-bottom)); border:1px solid var(--line); }
@media (min-width:600px) { .modal { align-items:center; } .modal-box { border-radius:26px; } }
.modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.modal-head b { font-size:1.1rem; font-family:'IBM Plex Sans Thai',sans-serif; }
.rf-prog { height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; }
.rf-prog i { display:block; height:100%; background:var(--brand); box-shadow:0 0 10px var(--glow); transition:width .25s; }
.rf-count { text-align:center; font-size:.85rem; color:var(--ink2); margin:8px 0 2px; }
.rf-icon { text-align:center; font-size:3rem; line-height:1.3; }
.rf-q { text-align:center; font-size:1.4rem; font-weight:700; line-height:1.4; font-family:'IBM Plex Sans Thai',sans-serif; }
.rf-q span { color:var(--danger); white-space:nowrap; }
.rf-ans { display:flex; gap:12px; margin-top:20px; }
.rf-ans button { flex:1; height:72px; border:none; border-radius:18px; font-size:1.5rem; font-weight:800; cursor:pointer; }
.rf-yes { background:linear-gradient(150deg,#E14848,#B3262C); color:#fff; box-shadow:0 8px 22px var(--danger-glow); }
.rf-no { background:var(--ok-bg); color:var(--ok); border:2px solid var(--ok) !important; }
.rf-back { display:block; margin:14px auto 0; background:none; border:none; color:var(--ink2); text-decoration:underline; cursor:pointer; }
.rf-res { text-align:center; border-radius:20px; padding:18px; }
.rf-res.emer { background:linear-gradient(150deg,#D83A3A,#A81E2E); color:#fff; }
.rf-res.ok { background:var(--ok-bg); color:var(--ok); }
.rf-res .big { font-size:2.6rem; }
.rf-res h3 { font-size:1.4rem; margin:4px 0; color:inherit; }
.rf-res p { font-weight:600; }

/* ═══════════════ วิดีโอ ═══════════════ */
.pv-box { margin:6px 0 20px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:12px; box-shadow:var(--shadow); }
.pv-head { font-weight:700; margin:0 2px 8px; font-family:'IBM Plex Sans Thai',sans-serif; }
.pv-tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:8px; }
.pv-tab { flex-shrink:0; padding:6px 14px; border-radius:16px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:.88rem; }
.pv-tab.on { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
.pv-frame { position:relative; width:100%; aspect-ratio:16/9; border-radius:14px; overflow:hidden; background:#000 center/cover no-repeat; cursor:pointer; }
.pv-frame iframe, .pv-frame video { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; object-fit:contain; }
.pv-play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:64px; height:64px; border-radius:50%; background:var(--brand); color:var(--brand-ink); font-size:1.6rem; display:flex; align-items:center; justify-content:center; padding-left:4px; box-shadow:0 0 24px var(--glow); }
#pv-overlay { position:fixed; inset:0; z-index:120; background:#000; display:none; flex-direction:column; height:100vh; height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
#pv-overlay.show { display:flex; }
.pvo-bar { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; }
.pvo-bar span { color:#fff; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pvo-bar button { padding:9px 16px; border-radius:20px; border:none; background:#fff; color:#000; font-weight:700; cursor:pointer; }
.pvo-stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
.pvo-frame { position:relative; width:100%; max-height:100%; aspect-ratio:16/9; }
.pvo-frame iframe, .pvo-frame video { position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:contain; background:#000; }
@media (orientation: landscape) { .pvo-frame { height:100%; width:auto; max-width:100%; } }
.chapter-img { width:100%; border-radius:18px; margin:6px 0 16px; display:block; }

/* ═══════════════ สำรวจอวัยวะ (Interactive) ═══════════════ */
.ax { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:14px; align-items:start; margin:12px 0 6px; }
.ax.compact, .hero .ax { grid-template-columns:minmax(0,1fr); }
@media (max-width:700px) { .ax { grid-template-columns:minmax(0,1fr); } }
.ax > * { min-width:0; }
html, body { overflow-x:hidden; }
.ax-stage { background:linear-gradient(160deg,#0C2136,#081626); border:1px solid rgba(120,200,255,.22); border-radius:24px; padding:10px; box-shadow:0 14px 40px rgba(4,20,36,.35), inset 0 0 40px rgba(63,214,204,.06); }
.ax-bar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.ax-views { display:flex; gap:4px; background:rgba(255,255,255,.07); padding:3px; border-radius:14px; }
.ax-views button, .ax-quad-btn { min-height:40px; padding:0 14px; border-radius:11px; border:none; background:transparent; color:#CFE3F4; font-weight:700; cursor:pointer; font-size:.88rem; }
.ax-views button.on { background:#3FD6CC; color:#03141E; box-shadow:0 0 14px rgba(63,214,204,.45); }
.ax-quad-btn { border:1px solid rgba(120,200,255,.3); }
.ax-quad-btn.on { background:#F4C760; color:#1A1200; border-color:#F4C760; }
.ax-img { position:relative; width:100%; border-radius:16px; overflow:hidden; background:#081626; user-select:none; -webkit-user-select:none; }
.ax-img img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
.ax-hint { color:#9FC0D8; font-size:.78rem; text-align:center; margin-top:6px; }
.ax-dot { position:absolute; width:44px; height:44px; margin:-22px 0 0 -22px; border:none; background:transparent; cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; z-index:2; }
.ax-dot span { width:20px; height:20px; border-radius:50%; background:var(--c); border:3px solid #fff; animation:axPulse 2.4s ease-out infinite; transition:transform .2s; }
.ax-dot.back span { border-style:dashed; background:rgba(255,255,255,.18); }
.ax-dot.on span { transform:scale(1.35); box-shadow:0 0 0 6px rgba(255,255,255,.35), 0 0 22px var(--c); animation:none; background:var(--c); }
.ax-img:has(.ax-dot.on) .ax-dot:not(.on) span { opacity:.45; animation:none; }
@keyframes axPulse { 0% { box-shadow:0 0 0 0 rgba(130,240,255,.7); } 70%,100% { box-shadow:0 0 0 12px rgba(130,240,255,0); } }
.ax-quad { position:absolute; inset:0; z-index:1; pointer-events:none; }
.ax-quad .qv { position:absolute; left:50%; top:30%; bottom:4%; border-left:2px dashed rgba(160,240,255,.95); }
.ax-quad .qh { position:absolute; top:58%; left:4%; right:4%; border-top:2px dashed rgba(160,240,255,.95); }
.ax-quad b { position:absolute; font-size:.8rem; color:#03141E; background:rgba(160,240,255,.92); padding:2px 8px; border-radius:8px; font-family:'IBM Plex Sans Thai',sans-serif; }
.ax-quad small { position:absolute; left:50%; bottom:2%; transform:translateX(-50%); white-space:nowrap; font-size:.7rem; color:#fff; background:rgba(8,22,38,.8); padding:2px 8px; border-radius:8px; }
.ax-chips { display:flex; gap:6px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none; }
.ax-chips::-webkit-scrollbar { display:none; }
@media (min-width:701px) { .ax:not(.compact) .ax-chips { flex-wrap:wrap; overflow:visible; } }
.ax-chips button { flex-shrink:0; display:inline-flex; align-items:center; gap:6px; min-height:42px; padding:0 14px; border-radius:21px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:.9rem; color:var(--ink); }
.ax-chips button i { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
.ax-chips button.on { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); box-shadow:0 0 14px var(--glow); }
.ax-info { margin-top:10px; background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:16px; box-shadow:var(--shadow); }
.ax-empty { text-align:center; color:var(--ink2); padding:8px 0; }
.ax-title { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.ax-title .sw { width:12px; height:46px; border-radius:6px; flex-shrink:0; box-shadow:0 0 12px currentColor; }
.ax-title div { flex:1; line-height:1.3; }
.ax-title b { display:block; font-size:1.35rem; font-family:'IBM Plex Sans Thai',sans-serif; }
.ax-title small { color:var(--ink2); }
.ax-say { width:48px; height:48px; border-radius:50%; border:1px solid var(--line); background:var(--brand-soft); color:var(--brand); font-size:1.1rem; cursor:pointer; }
.ax-say.on { background:var(--brand); color:var(--brand-ink); }
.ax-row { display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
.ax-row > span { width:1.6em; text-align:center; flex-shrink:0; }
.ax-row b { display:block; font-size:.85rem; color:var(--ink2); font-family:'IBM Plex Sans Thai',sans-serif; }
.ax-row em { font-style:normal; color:var(--ink2); font-size:.88rem; }
.ax-row ul.dots { gap:2px; }
.ax-hurt { margin-top:8px; background:var(--amber-bg); border:1px solid rgba(200,150,30,.3); border-radius:14px; padding:10px 14px; }
.ax-hurt b { display:block; color:var(--amber); font-size:.88rem; font-family:'IBM Plex Sans Thai',sans-serif; }
.ax-more { display:inline-block; margin-top:10px; font-weight:700; text-decoration:none; font-family:'IBM Plex Sans Thai',sans-serif; }

.refs-pics { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
.refs-pics button { border:1px solid var(--line); background:var(--surface); border-radius:18px; padding:6px; cursor:pointer; text-align:left; color:var(--ink); box-shadow:var(--shadow); }
.refs-pics img { width:100%; aspect-ratio:3/2; object-fit:cover; border-radius:12px; display:block; }
.refs-pics span { display:block; font-size:.82rem; font-weight:700; padding:6px 4px 2px; }
@media (max-width:420px) { .refs-pics { grid-template-columns:1fr; } }
#refOverlay { position:fixed; inset:0; z-index:120; background:#000; display:none; flex-direction:column; height:100vh; height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
#refOverlay.show { display:flex; }
.ref-scroll { flex:1; min-height:0; overflow:auto; display:flex; align-items:center; justify-content:center; -webkit-overflow-scrolling:touch; }
.ref-scroll img { max-width:100%; max-height:100%; display:block; }
#refOverlay.zoomed .ref-scroll { display:block; }
#refOverlay.zoomed .ref-scroll img { max-width:none; max-height:none; width:1536px; }

/* ═══════════════ พิมพ์ใบบันทึก ═══════════════ */
@media print {
  .topbar, .bottombar, .drawer, .scrim, .sheet, .modal, .no-print, .next-card, .pv-box, .sos, .jump { display:none !important; }
  body { background:#fff; color:#000; }
  main { padding:0; max-width:none; animation:none; }
  .section-block { box-shadow:none; background:#fff; }
  .form input, .form textarea { border:none; border-bottom:1px dotted #555; border-radius:0; background:#fff; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <button class="icon-btn" onclick="openDrawer()" aria-label="สารบัญ">☰</button>
    <div class="top-title"><small id="topSmall">คู่มือผู้ป่วยและญาติ</small><span id="topTitle">บาดเจ็บช่องท้อง</span></div>
    <div class="ring" aria-hidden="true"><svg viewBox="0 0 44 44"><circle class="bgc" cx="22" cy="22" r="18"/><circle class="fgc" id="ringFg" cx="22" cy="22" r="18" stroke-dasharray="113.1" stroke-dashoffset="113.1"/></svg><b id="ringTxt">0%</b></div>
    <button class="icon-btn" onclick="openSettings()" aria-label="ขนาดตัวอักษรและโหมดสี">Aa</button>
  </div>
  <div class="progress"><i id="progBar"></i></div>
</header>

<main id="main" tabindex="-1"></main>

<nav class="bottombar" aria-label="เปลี่ยนบท">
  <div class="au-panel" id="auPanel">
    <button class="au-play" id="auPlay" onclick="auToggle()" aria-label="เล่น / หยุด">▶</button>
    <input type="range" class="au-seek" id="auSeek" min="0" max="1000" value="0" aria-label="ตำแหน่งเสียง">
    <span class="au-time"><span id="auCur">0:00</span>/<span id="auDur">0:00</span></span>
    <button class="au-sm" id="auRate" onclick="auCycleRate()" title="ความเร็วเสียง">1x</button>
    <button class="au-sm" id="auAuto" onclick="auToggleAuto()" title="อ่านต่อบทถัดไปอัตโนมัติ" aria-label="อ่านต่อบทถัดไปอัตโนมัติ">🔁</button>
    <button class="au-sm" onclick="auClose()" aria-label="ปิดเครื่องเล่นเสียง">✕</button>
  </div>
  <div class="bottombar-in">
    <button class="nav-btn" id="btnPrev" onclick="go(cur-1)" aria-label="บทก่อนหน้า">‹ <span class="lbl">ก่อนหน้า</span></button>
    <div class="nav-mid"><span id="navMid">หน้าแรก</span><div class="dots-bar" id="dotsBar"></div></div>
    <button class="nav-btn au-btn" id="auBtn" onclick="auBtnClick()" aria-label="ฟังเสียงอ่านบทนี้">🔊</button>
    <button class="nav-btn sos-btn" onclick="openRedFlag()" aria-label="เช็กอาการอันตราย">🚨</button>
    <button class="nav-btn primary" id="btnNext" onclick="go(cur+1)" aria-label="บทถัดไป"><span class="lbl">ถัดไป</span> ›</button>
  </div>
</nav>
<audio id="auEl" preload="none"></audio>

<div class="scrim" id="scrim" onclick="closeAll()"></div>

<aside class="drawer" id="drawer" aria-label="สารบัญ">
  <div class="drawer-head"><b>สารบัญ</b><button class="icon-btn" onclick="closeAll()" aria-label="ปิด">✕</button></div>
  <ul class="toc" id="drawerToc"></ul>
</aside>

<section class="sheet" id="settings" aria-label="การแสดงผล">
  <h3>โหมดสี</h3>
  <div class="seg" id="themeSeg">
    <button data-t="light" onclick="setTheme('light')">☀️ สว่าง</button>
    <button data-t="dark" onclick="setTheme('dark')">🌙 มืด</button>
    <button data-t="auto" onclick="setTheme('auto')">ตามเครื่อง</button>
  </div>
  <h3 style="margin-top:18px;">ขนาดตัวอักษร</h3>
  <div class="font-row">
    <button onclick="changeFont(-1)" aria-label="ลดขนาดตัวอักษร">ก−</button>
    <div class="sample" id="fontSample">ขนาดปกติ</div>
    <button onclick="changeFont(1)" aria-label="เพิ่มขนาดตัวอักษร">ก+</button>
  </div>
  <button class="btn btn-ghost" style="width:100%;margin-top:18px;" onclick="closeAll()">เสร็จ</button>
</section>

<div class="modal" id="rfModal" role="dialog" aria-label="เช็กอาการอันตราย">
  <div class="modal-box">
    <div class="modal-head"><b>🚨 เช็กอาการอันตราย</b><button class="icon-btn" onclick="closeRedFlag()" aria-label="ปิด">✕</button></div>
    <div id="rfBody"></div>
  </div>
</div>

<div id="refOverlay" role="dialog" aria-label="ภาพขยาย">
  <div class="pvo-bar"><span class="ref-title"></span><div style="display:flex;gap:8px;"><button onclick="refZoom()">🔍 ขยาย</button><button onclick="closeRef()">✕ ปิด</button></div></div>
  <div class="ref-scroll"></div>
</div>

<div id="pv-overlay" role="dialog" aria-label="วิดีโอเต็มจอ">
  <div class="pvo-bar"><span id="pvoTitle">🎬 คลิปวิดีโอ</span><button onclick="pvCloseMax()">✕ ปิด</button></div>
  <div class="pvo-stage"><div class="pvo-frame" id="pvoFrame"></div></div>

const VIEWS = {
  front: { label:'ด้านหน้า', img:'front', ratio:'662 / 865' },

var EXP = {};   // สถานะของแต่ละกล่อง { view, sel, quad }

function explorerHTML(uid, opts) {
  opts = opts || {};
  EXP[uid] = { view:'front', sel:null, quad:false, compact:!!opts.compact };
  return '<div class="ax' + (opts.compact ? ' compact' : '') + '" id="' + uid + '">' +
    '<div class="ax-stage">' +
      '<div class="ax-bar">' +
        '<div class="ax-views" role="tablist">' + Object.keys(VIEWS).map(function (v) {
          return '<button role="tab" data-v="' + v + '" onclick="axView(\'' + uid + '\',\'' + v + '\')">' + VIEWS[v].label + '</button>';
        }).join('') + '</div>' +
        '<button class="ax-quad-btn" onclick="axQuad(\'' + uid + '\')" aria-pressed="false">✚ แบ่ง 4 ส่วน</button>' +
      '</div>' +
      '<div class="ax-pic"></div>' +
    '</div>' +
    '<div class="ax-side">' +
      '<div class="ax-chips">' + ORGANS.map(function (o) {
        return '<button data-o="' + o.id + '" onclick="axPick(\'' + uid + '\',\'' + o.id + '\')"><i style="background:' + o.color + '"></i>' + o.th + '</button>';
      }).join('') + '</div>' +
      '<div class="ax-info" aria-live="polite"></div>' +
    '</div>' +
  '</div>';
}

function axInit(uid) { axRender(uid); }

function axRender(uid) {
  var root = document.getElementById(uid); if (!root) return;
  var st = EXP[uid], v = VIEWS[st.view];
  root.querySelectorAll('.ax-views button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === st.view); b.setAttribute('aria-selected', b.dataset.v === st.view); });
  var qb = root.querySelector('.ax-quad-btn');
  qb.style.display = st.view === 'front' ? '' : 'none';
  qb.classList.toggle('on', st.quad); qb.setAttribute('aria-pressed', st.quad);

  var dots = '';
  ORGANS.forEach(function (o) {
    [o.pos[st.view], st.view === 'front' ? o.pos.front2 : null].forEach(function (p) {
      if (!p) return;
      dots += '<button class="ax-dot' + (o.back ? ' back' : '') + (st.sel === o.id ? ' on' : '') + '" style="left:' + p[0] + '%;top:' + p[1] + '%;--c:' + o.color + '" ' +
              'onclick="axPick(\'' + uid + '\',\'' + o.id + '\')" aria-label="' + o.th + '"><span></span></button>';
    });
  });
  var quad = (st.view === 'front' && st.quad)
    ? '<div class="ax-quad"><i class="qv"></i><i class="qh"></i>' +
      '<b style="left:4%;top:4%">ขวาบน</b><b style="right:4%;top:4%">ซ้ายบน</b>' +
      '<b style="left:4%;bottom:12%">ขวาล่าง</b><b style="right:4%;bottom:12%">ซ้ายล่าง</b>' +
      '<small>แบ่งโดยมีสะดือเป็นจุดกลาง · ขวา/ซ้าย ของผู้ป่วย</small></div>'
    : '';
  root.querySelector('.ax-pic').innerHTML =
    '<div class="ax-img" style="aspect-ratio:' + v.ratio + '">' +
      '<img src="' + IMGDATA[v.img] + '" alt="ภาพกายวิภาคช่องท้อง ' + v.label + '" draggable="false">' + quad + dots +
    '</div>' +
    (st.view === 'front' ? '<div class="ax-hint">ขวา ← ผู้ป่วย → ซ้าย · จุดเส้นประ = อยู่ด้านหลัง</div>' : '<div class="ax-hint">มองจากด้านข้าง เห็นอวัยวะที่อยู่ลึกและท้องน้อย</div>');

  root.querySelectorAll('.ax-chips button').forEach(function (b) { b.classList.toggle('on', b.dataset.o === st.sel); });
  axInfo(uid);
}

function axInfo(uid) {
  var root = document.getElementById(uid), st = EXP[uid], box = root.querySelector('.ax-info');
  var o = ORGANS.filter(function (x) { return x.id === st.sel; })[0];
  if (!o) {
    box.innerHTML = '<div class="ax-empty">👆 แตะจุดบนภาพ หรือชื่ออวัยวะ<br>เพื่อดูว่าอยู่ตรงไหน ทำหน้าที่อะไร</div>';
    return;
  }
  box.innerHTML =
    '<div class="ax-title"><span class="sw" style="background:' + o.color + '"></span><div><b>' + o.th + '</b><small>' + o.en + '</small></div>' +
      '<button class="ax-say" data-o="' + o.id + '" style="display:none" onclick="axSay(this)" aria-label="ฟังเสียงอธิบาย">🔊</button></div>' +
    '<div class="ax-row"><span>📍</span><div><b>ตำแหน่ง</b>' + o.where + (o.back ? ' <em>(มองไม่เห็นจากด้านหน้า)</em>' : '') + '</div></div>' +
    '<div class="ax-row"><span>⚙️</span><div><b>หน้าที่</b>' + ul(o.fn) + '</div></div>' +
    (o.hurt ? '<div class="ax-hurt"><b>เมื่อได้รับบาดเจ็บ</b>' + o.hurt + '</div>' : '') +
    (careFor(o.id) ? '<button class="ax-more ax-care" onclick="goCare(\'' + careFor(o.id) + '\')">ดูวิธีดูแลตัวเองหลังบาดเจ็บ ›</button>'
      : (o.ch && o.ch !== cur ? '<a class="ax-more" href="#ch' + o.ch + '">อ่านเพิ่มใน ส่วนที่ ' + o.ch + ' ›</a>' : ''));
  // ปุ่มเสียงอธิบายอวัยวะ (แสดงเมื่อมีไฟล์)
  var btn = box.querySelector('.ax-say'), src = 'audio/organ-' + o.id + '.mp3';
  axProbe(src, function (ok) { if (ok && btn.isConnected) { btn.style.display = ''; btn.dataset.src = src; } });
}

function careFor(organId) {
  var map = { liver:'liver', spleen:'spleen', stomach:'stomach', smallbowel:'stomach', colon:'colon', pancreas:'pancreas', kidney:'kidney', bladder:'bladder' };
  return map[organId] || null;
}
function axPick(uid, id) {
  var st = EXP[uid];
  if (st.sel === id) { st.sel = null; axRender(uid); return; }
  st.sel = id;
  var o = ORGANS.filter(function (x) { return x.id === id; })[0];
  if (!o.pos[st.view] && !(st.view === 'front' && o.pos.front2)) st.view = o.pos.front ? 'front' : 'side';   // เปลี่ยนมุมมองให้อัตโนมัติ
  axRender(uid);
  var info = document.querySelector('#' + uid + ' .ax-info');
  if (info && window.innerWidth < 760 && info.getBoundingClientRect().top > window.innerHeight - 120) info.scrollIntoView({ behavior:'smooth', block:'nearest' });
}
function axView(uid, v) { EXP[uid].view = v; axRender(uid); }
function axQuad(uid) { EXP[uid].quad = !EXP[uid].quad; axRender(uid); }

var _axOk = {}, _axAudio = null;
function axProbe(src, cb) {
  if (src in _axOk) return cb(_axOk[src]);
  if (!/^https?:/.test(location.protocol)) { _axOk[src] = false; return cb(false); }
  var a = new Audio(), done = false;
  var fin = function (ok) { if (done) return; done = true; _axOk[src] = ok; a.removeAttribute('src'); cb(ok); };
  a.preload = 'metadata';
  a.addEventListener('loadedmetadata', function () { fin(true); });
  a.addEventListener('error', function () { fin(false); });
  setTimeout(function () { fin(false); }, 6000);
  a.src = src;
}
function axSay(btn) {
  if (AU && AU.el) AU.el.pause();
  if (_axAudio && !_axAudio.paused) { _axAudio.pause(); btn.classList.remove('on'); return; }
  _axAudio = new Audio(btn.dataset.src);
  btn.classList.add('on');
  _axAudio.addEventListener('ended', function () { btn.classList.remove('on'); });
  _axAudio.play().catch(function () { btn.classList.remove('on'); });
}

function openRef(key, title) {
  var ov = document.getElementById('refOverlay');
  ov.querySelector('.ref-title').textContent = title;
  ov.querySelector('.ref-scroll').innerHTML = '<img src="' + IMGDATA[key] + '" alt="' + esc(title) + '">';
  ov.classList.add('show');
  ov.classList.remove('zoomed');
}
function closeRef() { document.getElementById('refOverlay').classList.remove('show'); }
function refZoom() { document.getElementById('refOverlay').classList.toggle('zoomed'); }

  document.getElementById('ringFg').style.strokeDashoffset = (113.1 * (1 - pct / 100)).toFixed(1);
  document.getElementById('ringTxt').textContent = pct + '%';
  document.getElementById('navMid').textContent = i === 0 ? 'หน้าแรก' : (i === CHAPTERS.length - 1 ? 'ใบบันทึก' : 'ส่วนที่ ' + i + ' / ' + (CHAPTERS.length - 2));
  var vis = visited(), dots = '';
  for (var d = 1; d < CHAPTERS.length; d++) dots += '<i class="' + (d === i ? 'on' : (vis.indexOf(d) > -1 ? 'done' : '')) + '"></i>';
  document.getElementById('dotsBar').innerHTML = dots;
  document.getElementById('btnPrev').disabled = i === 0;
  document.getElementById('btnNext').disabled = i === CHAPTERS.length - 1;
  document.getElementById('drawerToc').innerHTML = '<li><a href="#home" class="' + (i === 0 ? 'cur' : '') + '" onclick="closeAll()"><span class="n">⌂</span><span class="t"><b>หน้าแรก</b><small>สารบัญและแผนภาพอวัยวะ</small></span></a></li>' + tocHTML();
  document.title = (i === 0 ? '' : c.title + ' — ') + 'บาดเจ็บช่องท้อง';
  auOnChapter();
}

// ══════════════════════════════════════════════════════
// แผงสารบัญ / ตั้งค่าการแสดงผล
// ══════════════════════════════════════════════════════
function openDrawer() { document.getElementById('drawer').classList.add('show'); document.getElementById('scrim').classList.add('show'); }
function openSettings() { syncSettings(); document.getElementById('settings').classList.add('show'); document.getElementById('scrim').classList.add('show'); }
function closeAll() { ['drawer','settings','scrim'].forEach(function (id) { document.getElementById(id).classList.remove('show'); }); }

function currentTheme() { try { return localStorage.getItem('abdTheme') || 'auto'; } catch (e) { return 'auto'; } }
function setTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('abdTheme', t); } catch (e) {}
  syncSettings();
}
var FONT_STEPS = [1, 1.1, 1.22, 1.36, 1.5];
var FONT_NAMES = ['เล็ก', 'ปกติ', 'ใหญ่', 'ใหญ่มาก', 'ใหญ่ที่สุด'];
function fontIdx() {
  var f = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fz')) || 1.1;
  var best = 0; FONT_STEPS.forEach(function (s, i) { if (Math.abs(s - f) < Math.abs(FONT_STEPS[best] - f)) best = i; });
  return best;
}
function changeFont(d) {
  var i = Math.max(0, Math.min(FONT_STEPS.length - 1, fontIdx() + d));
  document.documentElement.style.setProperty('--fz', FONT_STEPS[i]);
  try { localStorage.setItem('abdFont', String(FONT_STEPS[i])); } catch (e) {}
  syncSettings();
}
function syncSettings() {
  var t = currentTheme();
  document.querySelectorAll('#themeSeg button').forEach(function (b) { b.classList.toggle('on', b.dataset.t === t); });
  document.getElementById('fontSample').textContent = 'ขนาด' + FONT_NAMES[fontIdx()];
}

// ══════════════════════════════════════════════════════
// เช็กอาการอันตราย (ถามทีละข้อ ใช่ / ไม่ใช่)
// ══════════════════════════════════════════════════════
var RF = { i:0 };
function openRedFlag() { RF.i = 0; closeAll(); document.getElementById('rfModal').classList.add('show'); rfRender(); }
function closeRedFlag() { document.getElementById('rfModal').classList.remove('show'); }
function rfRender() {
  var d = DANGER_SIGNS[RF.i];
  document.getElementById('rfBody').innerHTML =
    '<div class="rf-prog"><i style="width:' + Math.round(RF.i / DANGER_SIGNS.length * 100) + '%"></i></div>' +
    '<div class="rf-count">ข้อ ' + (RF.i + 1) + ' จาก ' + DANGER_SIGNS.length + '</div>' +
    '<div class="rf-icon">' + d[0] + '</div>' +
    '<div class="rf-q">' + d[1] + ' <span>ใช่ไหม?</span></div>' +
    '<div class="rf-ans"><button class="rf-yes" onclick="rfAnswer(true)">ใช่</button><button class="rf-no" onclick="rfAnswer(false)">ไม่ใช่</button></div>' +
    (RF.i > 0 ? '<button class="rf-back" onclick="RF.i--;rfRender()">← ย้อนกลับข้อก่อนหน้า</button>' : '');
}
function rfAnswer(yes) {
  var box = document.getElementById('rfBody');
  if (yes) {
    var d = DANGER_SIGNS[RF.i];
    box.innerHTML = '<div class="rf-res emer"><div class="big">🚨</div><h3>ต้องกลับโรงพยาบาลทันที</h3>' +
      '<p>' + d[1] + '</p><p style="margin-top:8px;">โทร 1669 หรือให้ญาติพาไปห้องฉุกเฉินที่ใกล้ที่สุด</p>' +
      '<a class="call-btn" href="tel:1669">📞 1669</a></div>' +
      '<button class="btn btn-ghost" style="width:100%;margin-top:10px;" onclick="RF.i=0;rfRender()">↺ เริ่มตอบใหม่</button>';
    return;
  }
  RF.i++;
  if (RF.i < DANGER_SIGNS.length) return rfRender();
  box.innerHTML = '<div class="rf-res ok"><div class="big">✅</div><h3>ยังไม่พบอาการอันตราย</h3>' +
    '<p>ดูแลตัวเองตามคู่มือ และไปตามนัดทุกครั้ง ถ้ามีอาการเปลี่ยนแปลง กลับมาเช็กใหม่ได้ตลอด</p></div>' +
    '<button class="btn btn-brand" style="width:100%;margin-top:10px;" onclick="closeRedFlag()">ปิด</button>';
}

// ══════════════════════════════════════════════════════
// วิดีโอ
// ══════════════════════════════════════════════════════
function vidList(i) {
  var v = (MEDIA[i] || {}).video;
  if (!v) return [];
  if (!Array.isArray(v)) v = [v];
  return v.map(function (x, n) {
    if (typeof x === 'string') x = { url:x };
    return { title: x.title || (v.length > 1 ? 'คลิปที่ ' + (n + 1) : 'คลิปวิดีโอ'), url: String(x.url || '').trim() };
  }).filter(function (x) { return vidInfo(x.url); });
}
function vidInfo(url) {
  if (!url) return null;
  if (/\.(mp4|webm|m4v)(\?|#|$)/i.test(url)) return { type:'file', src:url };
  var m = url.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([\w-]{11})/) || url.match(/^([\w-]{11})$/);
  if (m) return { type:'yt', id:m[1] };
  var g = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]{20,})/);
  return g ? { type:'gd', id:g[1] } : null;
}
function vidCover(v) {
  var info = vidInfo(v.url);
  var bg = info.type === 'yt' ? 'background-image:url(https://i.ytimg.com/vi/' + info.id + '/hqdefault.jpg);' : '';
  return '<div class="pv-frame" data-url="' + esc(v.url) + '" style="' + bg + '" onclick="pvPlay(this)" role="button" aria-label="เล่นวิดีโอ ' + esc(v.title) + '"><span class="pv-play">▶</span></div>';
}
function vidBlock(i) {
  var list = vidList(i);
  if (!list.length) return '';
  return '<div class="pv-box" data-ch="' + i + '"><div class="pv-head">🎬 ' + (list.length > 1 ? 'คลิปวิดีโอ (' + list.length + ' คลิป)' : esc(list[0].title)) + '</div>' +
    (list.length > 1 ? '<div class="pv-tabs">' + list.map(function (v, n) { return '<button class="pv-tab' + (n ? '' : ' on') + '" data-n="' + n + '" onclick="pvTab(this)">' + esc(v.title) + '</button>'; }).join('') + '</div>' : '') +
    '<div class="pv-holder">' + vidCover(list[0]) + '</div></div>';
}
function pvTab(btn) {
  var box = btn.closest('.pv-box');
  box.querySelectorAll('.pv-tab').forEach(function (b) { b.classList.toggle('on', b === btn); });
  box.querySelector('.pv-holder').innerHTML = vidCover(vidList(+box.dataset.ch)[+btn.dataset.n]);
}
function playerHTML(info) {
  if (info.type === 'yt') return '<iframe src="https://www.youtube-nocookie.com/embed/' + info.id + '?autoplay=1&rel=0&playsinline=1" title="คลิปวิดีโอ" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
  if (info.type === 'gd') return '<iframe src="https://drive.google.com/file/d/' + info.id + '/preview" title="คลิปวิดีโอ" allow="autoplay; fullscreen" allowfullscreen></iframe>';
  return '<video src="' + esc(info.src) + '" controls autoplay playsinline></video>';
}
function isSmall() { return window.matchMedia('(max-width: 760px), (pointer: coarse) and (max-width: 1024px)').matches; }
function pvPlay(el) {
  var info = vidInfo(el.getAttribute('data-url')); if (!info) return;
  if (AU.el) AU.el.pause();
  if (isSmall()) {
    var box = el.closest('.pv-box'), on = box && box.querySelector('.pv-tab.on');
    document.getElementById('pvoTitle').textContent = '🎬 ' + (on ? on.textContent : 'คลิปวิดีโอ');
    document.getElementById('pvoFrame').innerHTML = playerHTML(info);
    document.getElementById('pv-overlay').classList.add('show');
    return;
  }
  el.onclick = null; el.style.backgroundImage = '';
  el.innerHTML = playerHTML(info);
}
function pvCloseMax() { document.getElementById('pv-overlay').classList.remove('show'); document.getElementById('pvoFrame').innerHTML = ''; }

// ══════════════════════════════════════════════════════
// เสียงอ่าน (ไฟล์ที่อัดเอง)
// ══════════════════════════════════════════════════════
var AU = { el:null, ok:{}, missing:{}, auto:false, rateIdx:1, next:false, seeking:false };
var AU_RATES = [ { v:0.8, t:'0.8x' }, { v:1, t:'1x' }, { v:1.2, t:'1.2x' } ];
try { AU.auto = localStorage.getItem('abdAuAuto') === '1'; var _r = parseInt(localStorage.getItem('abdAuRate'), 10); if (_r >= 0 && _r < 3) AU.rateIdx = _r; } catch (e) {}
function auSrc(i) { return ((MEDIA[i] || {}).audio || '').trim(); }
function auFmt(t) { if (!isFinite(t) || t < 0) t = 0; var m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + (s < 10 ? '0' : '') + s; }
function auProbe(i, cb) {
  var src = auSrc(i);
  if (!src || AU.missing[src]) return cb(false);
  if (AU.ok[src]) return cb(true);
  var a = new Audio(), done = false;
  var fin = function (ok) { if (done) return; done = true; (ok ? AU.ok : AU.missing)[src] = true; a.removeAttribute('src'); cb(ok); };
  a.preload = 'metadata';
  a.addEventListener('loadedmetadata', function () { fin(true); });
  a.addEventListener('error', function () { fin(false); });
  setTimeout(function () { fin(false); }, 8000);
  a.src = src;
}
function auUI() {
  var p = AU.el && !AU.el.paused && !AU.el.ended;
  document.getElementById('auPlay').textContent = p ? '⏸' : '▶';
  document.getElementById('auRate').textContent = AU_RATES[AU.rateIdx].t;
  document.getElementById('auAuto').classList.toggle('on', AU.auto);
}
function auOnChapter() {
  if (!AU.el) return;
  var i = cur, cont = AU.next; AU.next = false;
  var wasOpen = document.getElementById('auPanel').classList.contains('show');
  AU.el.pause();
  document.getElementById('auBtn').classList.remove('has-audio', 'active');
  document.getElementById('auPanel').classList.remove('show');
  document.body.classList.remove('au-open');
  auProbe(i, function (ok) {
    if (cur !== i || !ok) return;
    document.getElementById('auBtn').classList.add('has-audio');
    if (cont || (wasOpen && AU.auto)) auOpen();
  });
}
function auOpen() {
  var src = auSrc(cur); if (!src) return;
  if (AU.el.getAttribute('src') !== src) { AU.el.src = src; document.getElementById('auSeek').value = 0; document.getElementById('auCur').textContent = '0:00'; document.getElementById('auDur').textContent = '0:00'; }
  AU.el.playbackRate = AU_RATES[AU.rateIdx].v;
  document.getElementById('auPanel').classList.add('show');
  document.getElementById('auBtn').classList.add('active');
  document.body.classList.add('au-open');
  var p = AU.el.play(); if (p && p.catch) p.catch(function () { auUI(); });
  auUI();
}
function auClose() { AU.el.pause(); document.getElementById('auPanel').classList.remove('show'); document.getElementById('auBtn').classList.remove('active'); document.body.classList.remove('au-open'); }
function auBtnClick() { if (document.getElementById('auPanel').classList.contains('show')) auClose(); else auOpen(); }
function auToggle() { if (AU.el.paused || AU.el.ended) { if (AU.el.ended) AU.el.currentTime = 0; AU.el.play().catch(function () {}); } else AU.el.pause(); }
function auCycleRate() { AU.rateIdx = (AU.rateIdx + 1) % 3; AU.el.playbackRate = AU_RATES[AU.rateIdx].v; try { localStorage.setItem('abdAuRate', AU.rateIdx); } catch (e) {} auUI(); }
function auToggleAuto() { AU.auto = !AU.auto; try { localStorage.setItem('abdAuAuto', AU.auto ? '1' : '0'); } catch (e) {} auUI(); }
(function auInit() {
  var el = AU.el = document.getElementById('auEl'), seek = document.getElementById('auSeek');
  el.addEventListener('play', auUI); el.addEventListener('pause', auUI);
  el.addEventListener('loadedmetadata', function () { document.getElementById('auDur').textContent = auFmt(el.duration); el.playbackRate = AU_RATES[AU.rateIdx].v; });
  el.addEventListener('timeupdate', function () { if (AU.seeking || !el.duration) return; seek.value = Math.round(el.currentTime / el.duration * 1000); document.getElementById('auCur').textContent = auFmt(el.currentTime); });
  el.addEventListener('ended', function () { auUI(); if (AU.auto && cur < CHAPTERS.length - 1) { AU.next = true; setTimeout(function () { go(cur + 1); }, 700); } });
  seek.addEventListener('input', function () { AU.seeking = true; if (el.duration) document.getElementById('auCur').textContent = auFmt(seek.value / 1000 * el.duration); });
  seek.addEventListener('change', function () { if (el.duration) el.currentTime = seek.value / 1000 * el.duration; AU.seeking = false; });
})();

// ══════════════════════════════════════════════════════
// ปัดซ้าย/ขวาเพื่อเปลี่ยนบท (นิ้วเดียว แนวนอนชัดเจน ไม่นับการซูม)
// ══════════════════════════════════════════════════════
var SW = { x:0, y:0, t:0, ok:false };
function uiOpen() { return !!document.querySelector('.drawer.show, .sheet.show, .modal.show, #pv-overlay.show, #refOverlay.show'); }
document.addEventListener('touchstart', function (e) {
  if (e.touches.length > 1) { SW.ok = false; return; }
  var t = e.target;
  SW.ok = !uiOpen() && !(t.closest && t.closest('input,textarea,select,.ax,.pv-box,.au-panel,.compare,.twocol,.refs-pics,.jump')) && !(window.visualViewport && visualViewport.scale > 1.05);
  SW.x = e.touches[0].clientX; SW.y = e.touches[0].clientY; SW.t = Date.now();
}, { passive:true });
document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) SW.ok = false; }, { passive:true });
document.addEventListener('touchend', function (e) {
  if (!SW.ok || e.touches.length) return; SW.ok = false;
  var t = e.changedTouches[0], dx = t.clientX - SW.x, dy = t.clientY - SW.y;
  if (Date.now() - SW.t < 600 && Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2.2) go(dx < 0 ? cur + 1 : cur - 1);
}, { passive:true });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeAll(); closeRedFlag(); pvCloseMax(); closeRef(); return; }
  if (uiOpen() || (e.target.closest && e.target.closest('input,textarea'))) return;
  if (e.key === 'ArrowRight') go(cur + 1);
  if (e.key === 'ArrowLeft') go(cur - 1);
});

// ══════════════════════════════════════════════════════
// อัปเดตอัตโนมัติเมื่อไฟล์ใน GitHub เปลี่ยน
// ══════════════════════════════════════════════════════
(function autoUpdate() {
  if (!/^https?:/.test(location.protocol) || !window.fetch) return;
  try { if (Date.now() - (+sessionStorage.getItem('abdReload') || 0) < 60000) return; } catch (e) {}
  var url = location.pathname;
  Promise.all([
    fetch(url, { cache:'force-cache' }).then(function (r) { return r.ok ? r.text() : null; }),
    fetch(url, { cache:'no-cache' }).then(function (r) { return r.ok ? r.text() : null; })
  ]).then(function (t) {
    if (!t[0] || !t[1] || t[0] === t[1]) return;
    if (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    try { sessionStorage.setItem('abdReload', String(Date.now())); } catch (e) {}
    location.reload();
  }).catch(function () {});
})();

render(chapterFromHash());
